name: .NET 10

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native SQLite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: dotnet restore Mobile.CQRS.sln
      - run: dotnet build Mobile.CQRS.sln -c Release --no-restore
      - run: dotnet test Mobile.CQRS.sln -c Release --no-build --no-restore
      - name: Verify offline sync recovery sample
        run: dotnet run --project Samples/OfflineSync -c Release --no-build --no-restore
